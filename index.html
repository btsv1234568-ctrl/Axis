<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AXIS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>AXIS</title>
<style>
:root{--bg:#080808;--fg:#f4f4f2;--sil:#c9ccd2;--mut:#8b8d92;--dim:#4f5156;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.07);--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--nav:54px;--hh:clamp(150px,25dvh,224px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;overflow:hidden;color-scheme:dark}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
svg{display:block}
#app{height:100dvh;display:flex;flex-direction:column}
.page{display:none;flex:1;min-height:0;flex-direction:column;padding:calc(var(--st) + 12px) 20px 0}
.page.active{display:flex;animation:fi .35s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center;height:28px;flex:none}
.logo{font-weight:600;font-size:13px;letter-spacing:.46em;padding-left:.46em}
.ib{width:36px;height:36px;display:grid;place-items:center;margin-right:-8px;color:var(--sil)}
.ib svg,.nb svg{stroke:currentColor;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
/* hero */
.hero{display:flex;justify-content:space-between;height:var(--hh);flex:none;margin-top:4px}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0 2px;min-width:0}
.date{font-size:12px;color:var(--mut);letter-spacing:.04em}
.date button{margin-left:8px;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:12px}
h1{font-weight:300;font-size:30px;letter-spacing:-.02em;margin-top:6px}
.pct{font-weight:200;font-size:clamp(54px,10dvh,88px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pct sup{font-size:.32em;font-weight:300;color:var(--mut);vertical-align:top;margin-left:4px;letter-spacing:0;position:relative;top:.35em}
#p-today{position:relative;overflow:hidden}
#orbs{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
#p-today>*:not(#orbs){position:relative;z-index:1}
/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);margin:8px -4px 0;flex:none;touch-action:pan-y}
.wk{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.wd{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.wn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:var(--sil);border:1px solid transparent;font-variant-numeric:tabular-nums;transition:.2s}
.wk.td .wn{color:var(--fg);font-weight:600}
.wk.sel .wn{border-color:var(--fg);color:var(--fg)}
.wb{width:14px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.wb i{display:block;height:100%;background:var(--fg)}
/* progress */
.prog{flex:none;margin-top:10px}
.bar{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7d8087,#fff);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cnt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-top:8px;min-height:18px}
.cnt button{color:var(--fg);font-size:12px;text-decoration:underline;text-underline-offset:3px}
/* list */
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:4px -20px 0;padding:0 20px}
.task{display:grid;grid-template-columns:44px 2px 1fr 30px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.tm{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.15}
.tm b{font-weight:400;font-size:14px;color:var(--sil);transition:color .3s}
.tm b.nt{color:var(--dim)}
.tm small{font-size:10.5px;color:var(--dim)}
.vb{width:1px;height:28px;background:var(--c,#f4f4f2);justify-self:center;transition:opacity .3s}
.task.p2 .vb{width:2px}
.tt{min-width:0;display:flex;align-items:center;gap:8px}
.tl{font-size:15.5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1px;transition:background-size .38s cubic-bezier(.3,.7,.2,1),color .38s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline;padding-bottom:1px}
.task.p0 .tl{color:var(--sil)}
.cf{font-style:normal;font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 6px;flex:none}
.rp{font-size:11px;color:var(--dim);flex:none}
.chk{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;justify-self:end;position:relative;transition:.3s}
.chk::before{content:"";position:absolute;inset:-9px}
.chk svg{width:14px;height:14px;stroke:#080808;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s .08s}
.task.done .tl{color:var(--dim);background-size:100% 1px}
.task.done .tm b{color:var(--dim)}
.task.done .vb{opacity:.3}
.task.done .chk{background:var(--fg);border-color:var(--fg)}
.task.done .chk svg{stroke-dashoffset:0}
.empty{padding:26px 0;text-align:center;color:var(--mut);font-size:13px;line-height:1.5}

/* ===== главная: список задач — главный акцент ===== */
#p-today .hero{height:auto;margin-top:6px}
#p-today .hero-l{justify-content:flex-start;gap:0;padding:0}
#p-today h1{font-size:32px;margin-top:2px}
#p-today .pct{font-size:clamp(44px,7.4dvh,62px);margin-top:6px}
#p-today .week{margin-top:8px}
#p-today .wn{width:30px;height:30px}
#p-today .prog{margin-top:6px}
#p-today .list{margin-top:0}
#p-today .task{grid-template-columns:44px 3px minmax(0,1fr) 32px;gap:14px;min-height:68px;padding:6px 0}
#p-today .tm b{font-size:14.5px;color:var(--mut)}
#p-today .tm small{font-size:11px}
#p-today .vb{width:3px;height:34px;border-radius:3px}
#p-today .task.p2 .vb{box-shadow:0 0 7px rgba(255,255,255,.35)}
#p-today .task.p0 .vb{opacity:.6}
#p-today .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#p-today .tl{font-size:23px;font-weight:400;letter-spacing:-.012em;line-height:1.16;display:inline;white-space:normal;background-position:0 62%}
#p-today .cf,#p-today .rp{display:inline-block;margin-left:8px;vertical-align:middle}
#p-today .cf{font-size:0;width:17px;height:17px;padding:0;position:relative}
#p-today .cf::after{content:"!";font-size:11px;position:absolute;inset:0;display:grid;place-items:center;color:var(--sil)}
#p-today .chk{width:28px;height:28px}
#p-today .chk svg{width:15px;height:15px}
#p-today .empty{font-size:14px;padding:34px 0}

/* ===== календарь: крупный месяц ===== */
#p-cal{padding-left:10px;padding-right:10px}
#c-mode{display:none}
#p-cal .ch,#p-cal .dh{padding:0 10px}
#p-cal .ch h2{font-size:40px;font-weight:300;letter-spacing:-.03em}
#p-cal .ca button{font-size:30px;height:44px;min-width:44px}
#p-cal .ca .tdy{font-size:13px;height:30px;min-width:0;padding:0 14px;margin:0 2px}
#p-cal .mg{margin-top:8px}
#p-cal .mg .h{font-size:12px;padding:6px 0 8px;color:var(--mut)}
#p-cal .cell{height:58px;justify-content:flex-start;padding-top:2px;gap:0}
#p-cal .cell .n{width:46px;height:46px;font-size:29px;font-weight:300;color:var(--fg);transition:background .2s,color .2s}
#p-cal .cell.out .n{color:var(--dim)}
#p-cal .cell.past .n{color:#5d5f64}
#p-cal .cell.past.out .n{color:#34363a}
#p-cal .cell.td .n{font-weight:500;border-color:var(--line)}
#p-cal .cell.sel .n{background:var(--fg);color:#080808;border-color:var(--fg);font-weight:400}
.bar1{position:absolute;bottom:0;left:50%;margin-left:-8px;width:16px;height:2px;border-radius:2px;background:var(--fg)}
#p-cal .cell.past .bar1{opacity:.45}
#p-cal .dh{margin:6px 0 0;padding-top:14px;padding-bottom:2px}
#p-cal .dh div{font-size:17px;color:var(--fg)}
#p-cal .dh small{font-size:13px}
#p-cal .list{margin:0 -10px;padding:0 20px}
#p-cal .task{grid-template-columns:44px 3px minmax(0,1fr) 32px;gap:14px;min-height:60px;padding:6px 0}
#p-cal .tm b{font-size:14.5px;color:var(--mut)}
#p-cal .vb{width:3px;height:30px;border-radius:3px}
#p-cal .tl{font-size:20px;font-weight:400;letter-spacing:-.01em}
#p-cal .cf{font-size:0;width:17px;height:17px;padding:0;position:relative}
#p-cal .cf::after{content:"!";font-size:11px;position:absolute;inset:0;display:grid;place-items:center;color:var(--sil)}
#p-cal .chk{width:28px;height:28px}
#p-cal .empty{font-size:14px;padding:30px 0}
/* ===== аналитика ===== */
#p-stats .ch h2{font-size:34px;font-weight:300;letter-spacing:-.03em}
.bigp{font-size:104px;font-weight:200;letter-spacing:-.055em;line-height:1;padding-top:6px;background:linear-gradient(180deg,#ffffff 8%,#a9acb2 62%,#6f7278 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;font-variant-numeric:tabular-nums}
.bigp sup{font-size:.34em;font-weight:300;letter-spacing:0;vertical-align:top;position:relative;top:.22em;margin-left:6px}
.segs{display:flex;gap:4px;margin-top:14px}
.segs i{flex:1;height:12px;border-radius:4px;background:#232427}
.segs i.on{background:linear-gradient(180deg,#fff,#b9bcc2)}
.nums{display:flex;margin-top:26px}
.nums div{flex:1}
.nums b{display:block;font-size:46px;font-weight:200;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.nums span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
#p-stats .sec{padding-top:26px;margin-top:26px}
#p-stats .sec h3{font-size:19px;font-weight:400;color:var(--fg);letter-spacing:-.01em;text-transform:none;margin-bottom:12px}
#p-stats .info{font-size:16px;min-height:24px;margin-bottom:8px;color:var(--mut)}
#p-stats .info b{font-size:16px}
.avg{font-size:40px;font-weight:200;letter-spacing:-.03em;margin-bottom:4px;font-variant-numeric:tabular-nums}
#p-stats .ax{fill:var(--sil);font-size:13px}
.hrow{margin-bottom:18px}
.hrow div{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;margin-bottom:8px}
.hrow em{font-style:normal;color:var(--mut);font-size:16px;font-variant-numeric:tabular-nums}
.hrow i{display:block;height:10px;border-radius:5px;background:#1c1d1f;overflow:hidden}
.hrow i b{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#9a9da3,#fff)}
.hm{gap:4px}
.hm i{border-radius:4px}
.ov-l button{font-size:16px;padding:12px 0}
/* foot */
.foot{flex:none;display:flex;gap:8px;align-items:center;padding:10px 0 12px}
.pill{border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12px;color:var(--mut);white-space:nowrap}
.pill b{color:var(--fg);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.add{margin-left:auto;height:40px;padding:0 18px;border-radius:99px;background:var(--fg);color:#080808;font-weight:500;font-size:14px;display:flex;align-items:center;gap:6px;flex:none}
.add svg{width:14px;height:14px;stroke:#080808;stroke-width:1.8}
.add.sm{height:34px;padding:0 14px;font-size:13px}
/* nav */
#nav{flex:none;display:flex;height:calc(var(--nav) + var(--sb));padding-bottom:var(--sb);border-top:1px solid var(--line2);background:#080808;position:relative;z-index:5}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--fg)}
/* wave */
#wave{position:fixed;left:0;right:0;top:0;height:34%;pointer-events:none;z-index:40;opacity:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.07) 45%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.07) 55%,transparent)}
#wave.go{animation:wave 1.9s cubic-bezier(.45,.1,.3,1)}
@keyframes wave{0%{transform:translateY(-100%);opacity:0}12%{opacity:1}85%{opacity:1}100%{transform:translateY(300%);opacity:0}}
/* calendar */
.ch{display:flex;justify-content:space-between;align-items:center;flex:none;margin-top:2px}
.ch h2{font-weight:300;font-size:26px;letter-spacing:-.02em}
.ca{display:flex;align-items:center;gap:2px}
.ca button{height:34px;min-width:34px;color:var(--sil);font-size:20px;line-height:1}
.ca .tdy{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 12px;min-width:0;margin:0 4px;height:28px;color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;margin:10px 0;flex:none;gap:2px}
.seg button{flex:1;padding:6px 0;border-radius:99px;font-size:12.5px;color:var(--mut);transition:.2s}
.seg button.on{background:var(--fg);color:#080808}
.mg{display:grid;grid-template-columns:repeat(7,1fr);flex:none;touch-action:pan-y}
.mg .h{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:2px 0 6px}
.cell{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;font-variant-numeric:tabular-nums}
.cell .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--sil);border:1px solid transparent}
.cell.out .n{color:var(--dim)}
.cell.td .n{font-weight:600;color:var(--fg)}
.cell.sel .n{border-color:var(--fg);color:var(--fg)}
.dots{display:flex;gap:3px;height:4px;position:absolute;bottom:1px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--c)}
.dots.dm{opacity:.35}
.cell .ovb{position:absolute;top:2px;right:6px;width:5px;height:5px;border-top:1px solid var(--mut);border-right:1px solid var(--mut)}
.dh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 2px;padding-top:10px;border-top:1px solid var(--line2);flex:none}
.dh div{font-size:13px;color:var(--sil)}
.dh small{color:var(--mut);text-transform:none;margin-left:6px;font-size:12px}
.ds{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.ds.td{color:var(--fg)}
.ds button{color:var(--sil);font-size:20px;line-height:1;padding:0 4px}
.free{font-size:12.5px;color:var(--dim);padding:6px 0 8px}
/* stats */
#p-stats .sc{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px 28px}
.sec{padding:18px 0 4px;border-top:1px solid var(--line2);margin-top:14px}
.sec h3{font-size:11px;font-weight:500;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.info{font-size:13px;color:var(--sil);min-height:18px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.info b{color:var(--fg);font-weight:500}
.chart{width:100%;touch-action:pan-y}
.gl{stroke:var(--line2);stroke-width:1}
.ax{fill:var(--dim);font-size:9px;font-family:inherit}
.ring{display:flex;align-items:center;gap:22px}
.rs{flex:1;display:flex;flex-direction:column;gap:10px}
.rs div{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line2);padding-bottom:8px}
.rs b{color:var(--fg);font-weight:400;font-variant-numeric:tabular-nums}
.lg{display:flex;flex-direction:column;margin-top:10px}
.lg button{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line2);text-align:left;color:var(--sil)}
.lg i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lg span{flex:1}.lg em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px;width:100%}
.hm i{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,var(--a));display:block}
.hm i.fu{background:none;border:1px solid var(--line2)}
.hm i.sl{outline:1px solid var(--fg)}
.ov-l{display:flex;flex-direction:column;margin-top:8px}
.ov-l button{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--sil)}
.ov-l em{font-style:normal;color:var(--mut)}
.nodata{font-size:13px;color:var(--mut);padding:6px 0 10px;line-height:1.5}
/* sheets */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;transition:opacity .28s}
.ovl.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0f0f0f;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 20px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.9,.2,1)}
.ovl.on .sheet{transform:none}
.grip{width:36px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh span{font-size:17px;font-weight:500}
.sh button{color:var(--mut);font-size:13px}
.in,.slc,textarea{width:100%;background:#171717;border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:44px}
.in:focus,textarea:focus,.slc:focus{border-color:rgba(255,255,255,.4)}
textarea{resize:none;min-height:64px}
.in[type=date],.in[type=time]{display:block;text-align:left}
.lb{display:block;font-size:11px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin:14px 0 6px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--sil);display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--fg);color:#080808;border-color:var(--fg)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.ok{border-style:dashed;color:var(--fg)}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.5}
.hint.w{color:var(--sil);border-left:1px solid var(--fg);padding-left:10px}
.acts{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);font-size:15px;color:var(--sil)}
.btn.pri{background:var(--fg);color:#080808;border-color:var(--fg);font-weight:500;flex:2}
.btn.dng{color:#d99}
.set{padding:14px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px}
.set>div:first-child{min-width:0}.set small{display:block;color:var(--mut);font-size:12px;margin-top:3px;line-height:1.45;max-width:230px}
.set .slc,.set .in{width:auto;min-width:96px}
.sw{width:46px;height:28px;border-radius:99px;border:1px solid var(--line);position:relative;flex:none;transition:.2s}

function healthPts(per,key){

  if(per==='year'){const n=new Date();for(let i=11;i>=0;i--){const m=new Date(n.getFullYear(),n.getMonth()-i,1),last=new Date(m.getFullYear(),m.getMonth()+1,0),vs=[];for(let d=1;d<=last.getDate();d++){const h=db.health[ymd(new Date(m.getFullYear(),m.getMonth(),d))];if(h&&h[key]!=null)vs.push(h[key])}out.push({label:MON_S[m.getMonth()],name:MON_N[m.getMonth()]+' (среднее)',v:vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null})}}
  else{const n=per==='week'?7:30;for(let i=n-1;i>=0;i--){const ds=addD(t0,-i),h=db.health[ds];out.push({label:per==='week'?WD_S[wdi(pd(ds))]:String(pd(ds).getDate()),name:shortDate(ds),v:h&&h[key]!=null?h[key]:null})}}
  return out}
const W=340;
function axisLabels(pts,y,x){const k=pts.length>14?5:1;return pts.map((p,i)=>(i%k===0||i===pts.length-1)&&!(pts.length>14&&i===pts.length-1&&i%k<3&&i%k!==0)?`<text x="${x(i)}" y="${y}" class="ax" text-anchor="middle">${p.label}</text>`:'').join('')}
function barSVG(id,pts,max,mode){
  const H=170,L=4,R=4,T=6,B=24,n=pts.length,cw=(W-L-R)/n,bw=Math.max(3,Math.min(22,cw*.58)),ih=H-T-B,y=v=>T+(1-clamp(v,0,max)/max)*ih,x=i=>+(L+(i+.5)*cw).toFixed(1);
  const pill=(i,y0,y1,fill)=>{const hg=y1-y0;return hg<=.4?'':`<rect x="${x(i)-bw/2}" y="${y0}" width="${bw}" height="${hg}" rx="${Math.min(bw/2,hg/2)}" fill="${fill}"/>`};
  const base=T+ih;
  const bars=pts.map((p,i)=>{
    if(mode==='stack'){const a=p.done||0,b2=p.miss||0;return pill(i,y(a+b2),base,'#3b3d41')+pill(i,y(a),base,'#f4f4f2')}
    return pill(i,T,base,'#1c1d1f')+(p.v==null?'':pill(i,y(p.v),base,'#f4f4f2'))}).join('');
  const k=n>14?5:1,labels=pts.map((p,i)=>(i%k===0&&!(n>14&&i>n-3&&i!==n-1)||(n>14&&i===n-1&&(n-1)%k>=3))?`<text x="${x(i)}" y="${H-6}" class="ax" text-anchor="middle">${p.label}</text>`:'').join('');
  return `<svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}">${bars}${labels}<rect class="cur" y="${T}" width="${cw}" height="${ih}" fill="rgba(255,255,255,.06)" rx="6" style="display:none"/></svg>`}
function scrub(svg,pts,mode,cb){
  const L=4,R=4,n=pts.length,cw=(W-L-R)/n;
  const f=e=>{const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*W;const i=clamp(Math.floor((vx-L)/cw),0,n-1);const cur=$('.cur',svg);cur.setAttribute('x',L+i*cw);cur.style.display='';cb(pts[i],i)};
  svg.addEventListener('pointerdown',f);svg.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'?e.buttons:e.pressure)f(e)})}
function renderStats(){
  const per=S.per,pts=buildPts(per),t0=today();
  $$('#s-per button').forEach(b=>b.classList.toggle('on',b.dataset.p===per));
  const done=pts.reduce((a,p)=>a+p.done,0),miss=pts.reduce((a,p)=>a+p.miss,0),withT=pts.filter(p=>p.total>0).length,rate=done+miss?done/(done+miss)*100:null;
  const sec=(t,b)=>`<div class="sec"><h3>${t}</h3>${b}</div>`,nd=m=>`<div class="nodata">${m}</div>`;
  let h='';
  const SEG=20,on=rate==null?0:Math.round(rate/100*SEG);
  h+=`<div><div class="bigp">${rate==null?'—':Math.round(rate)}${rate==null?'':'<sup>%</sup>'}</div><div class="segs">${Array.from({length:SEG},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div><div class="nums"><div><b>${done}</b><span>Выполнено</span></div><div><b>${miss}</b><span>Не выполнено</span></div><div><b>${withT}</b><span>${withT===1?'День с задачами':'Дней с задачами'}</span></div></div></div>`;
  h+=sec('По дням',pts.some(p=>p.v!=null)?`<div class="info" id="i1"></div>${barSVG('c1',pts,100,'pct')}`:nd('Пока нет задач в этом периоде.'));
  const mxT=Math.max(...pts.map(p=>p.done+p.miss)),step=mxT>6?4:2;
  h+=sec('Выполнено и нет',pts.some(p=>p.total>0)?`<div class="info" id="i2"></div>${barSVG('c2',pts,Math.max(2,Math.ceil(mxT/step)*step),'stack')}`:nd('Нет данных.'));
  /* время по сферам */
  const range=[pts[0].from,pts[pts.length-1].to],byC={};
  for(let ds=range[0];ds<=range[1];ds=addD(ds,1)){tasksOn(ds).forEach(t=>{if(isDone(t,ds)&&t.dur){const k=t.cat||'';byC[k]=(byC[k]||0)+t.dur}})}
  const items=Object.keys(byC).map(k=>({name:k?(catOf(k)||{name:'Без категории'}).name:'Без категории',min:byC[k]})).sort((a,b)=>b.min-a.min),tot=items.reduce((a,b)=>a+b.min,0);
  h+=sec('Время по сферам',tot?items.map(it=>`<div class="hrow"><div><span>${esc(it.name)}</span><em>${fmtMin(it.min)}</em></div><i><b style="width:${Math.max(3,it.min/items[0].min*100)}%"></b></i></div>`).join(''):nd('Укажите продолжительность в задачах — и здесь появится распределение времени.'));
  /* загруженность */
  const wl=[0,0,0,0,0,0,0],wc=[0,0,0,0,0,0,0],wn=[0,0,0,0,0,0,0];let anyDur=false;
  for(let i=0;i<56;i++){const ds=addD(t0,-i),w=wdi(pd(ds)),l=tasksOn(ds);wn[w]++;wl[w]+=planned(ds);wc[w]+=l.length;if(planned(ds))anyDur=true}
  const wp=wl.map((v,i)=>({label:WD_S[i],name:WD_L[i],v:anyDur?v/wn[i]/60:wc[i]/wn[i]}));const wmax=Math.max(...wp.map(p=>p.v));
  const ovd=[];for(let i=-30;i<=30;i++){const ds=addD(t0,i);if(overloaded(ds))ovd.push(ds)}
  let wsec=sec('Загруженность',wmax>0?`<div class="info" id="i3">${anyDur?'Часов':'Задач'} в день · в среднем</div>${barSVG('c3',wp,Math.max(1,Math.ceil(wmax)),'val')}`:nd('Нет данных.'));
  if(ovd.length)wsec=wsec.replace(/<\/div>$/,`<div class="ov-l">${ovd.slice(0,5).map(ds=>`<button data-gocal="${ds}"><span>${longDate(ds)}</span><em>${planned(ds)?fmtMin(planned(ds)):pl(tasksOn(ds).length,['задача','задачи','задач'])}</em></button>`).join('')}</div></div>`);
  h+=wsec;
  /* тепловая карта */
  const wk=18,mon0=addD(t0,-wdi(pd(t0))),startH=addD(mon0,-(wk-1)*7);let hcells=[],mx=0;
  for(let i=0;i<wk*7;i++){const ds=addD(startH,i),s2=ds>t0?null:dayStat(ds);hcells.push([ds,s2]);if(s2)mx=Math.max(mx,s2.done)}
  h+=sec('Активность',`<div class="info" id="i4">${shortDate(t0)} · <b>${dayStat(t0).done}</b> из ${dayStat(t0).total}</div><div class="hm" id="hm">${hcells.map(([ds,s2])=>{if(!s2)return `<i class="fu"></i>`;const lv=!s2.done||!mx?0:Math.ceil(s2.done/mx*4);return `<i style="--a:${[.06,.24,.42,.65,.92][lv]}" data-hd="${ds}"></i>`}).join('')}</div>`);
  /* здоровье */
  const sp=healthPts(per,'sleep').map(p=>({...p,v:p.v==null?null:p.v/60})),st=healthPts(per,'steps'),hv=a=>a.filter(p=>p.v!=null);
  h+=sec('Сон',hv(sp).length?`<div class="avg">${fmtSleep(hv(sp).reduce((a,p)=>a+p.v,0)/hv(sp).length*60)}</div><div class="info" id="i5">в среднем</div>${barSVG('c5',sp,Math.max(8,Math.ceil(Math.max(...hv(sp).map(p=>p.v)))),'val')}`:nd('Данных о сне нет. Внесите их на главной — плашка «Сон».'));
  h+=sec('Шаги',hv(st).length?`<div class="avg">${Math.round(hv(st).reduce((a,p)=>a+p.v,0)/hv(st).length).toLocaleString('ru-RU')}</div><div class="info" id="i6">в среднем</div>${barSVG('c6',st,Math.max(1000,Math.ceil(Math.max(...hv(st).map(p=>p.v))/2000)*2000),'val')}`:nd('Данных о шагах нет. Внесите их на главной — плашка «Шаги».'));
  const body=$('#s-body'),sc=body.scrollTop;body.innerHTML=h;body.scrollTop=sc;
  const bind=(id,pts2,infoId,fmt)=>{const sv=$('#'+id);if(!sv)return;scrub(sv,pts2,'bar',p=>{$('#'+infoId).innerHTML=fmt(p)});if(!/в среднем|средн/.test($('#'+infoId).textContent)){const lp=[...pts2].reverse().find(p=>p.v!=null||p.total)||pts2[pts2.length-1];$('#'+infoId).innerHTML=fmt(lp)}};
  bind('c1',pts,'i1',p=>`${p.name} · <b>${p.v==null?'нет задач':Math.round(p.v)+'%'}</b>${p.total?` · ${p.done} из ${p.total}`:''}`);
  bind('c2',pts,'i2',p=>`${p.name} · <b>${p.done}</b> выполнено · <b>${p.miss}</b> нет`);
  bind('c3',wp,'i3',p=>`${p.name} · <b>${p.v?(Math.round(p.v*10)/10).toString().replace('.',','):0}</b> ${anyDur?'ч':'задач'}`);
  bind('c5',sp,'i5',p=>`${p.name} · <b>${p.v==null?'нет данных':fmtSleep(p.v*60)}</b>`);
  bind('c6',st,'i6',p=>`${p.name} · <b>${p.v==null?'нет данных':Math.round(p.v).toLocaleString('ru-RU')}</b>`);
  $$('#hm [data-hd]').forEach(c=>c.addEventListener('click',()=>{$$('#hm .sl').forEach(x=>x.classList.remove('sl'));c.classList.add('sl');const s2=dayStat(c.dataset.hd);$('#i4').innerHTML=`${shortDate(c.dataset.hd)} · <b>${s2.done}</b> из ${s2.total}`}));
  $$('#s-body [data-gocal]').forEach(b=>b.addEventListener('click',()=>{S.sel=b.dataset.gocal;S.cc=S.sel.slice(0,8)+'01';go('cal')}))}
/* ========== navigation / refresh ========== */
function go(p){S.page=p;$$('.page').forEach(x=>x.classList.toggle('active',x.id==='p-'+p));$$('.nb').forEach(b=>b.classList.toggle('on',b.dataset.go===p));p==='today'?orbs.start():orbs.stop();refresh(true)}
function refresh(silent){if(S.page==='today')renderToday(silent);else if(S.page==='cal')renderCal();else renderStats()}
/* ========== events ========== */
document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-go]');if(nav){go(nav.dataset.go);return}
  const chk=e.target.closest('[data-chk]');
  if(chk){const row=chk.closest('.task'),t=db.tasks.find(x=>x.id===row.dataset.open),ds=row.dataset.d;if(!t)return;t.done=t.done||{};if(t.done[ds])delete t.done[ds];else t.done[ds]=Date.now();persist();row.classList.toggle('done',isDone(t,ds));if(isDone(t,ds))orbs.pulse();if(navigator.vibrate)navigator.vibrate(8);
    if(S.page==='today'){updateStats(false);renderWeek()}else if(S.page==='cal'){renderCalGridOnly()}return}
  const open=e.target.closest('[data-open]');if(open){openTask(open.dataset.open,open.dataset.d);return}
  const pick=e.target.closest('[data-pick]');if(pick){S.sel=pick.dataset.pick;S.cc=S.sel.slice(0,8)+'01';shownPct=dayStat(S.sel).total?shownPct:0;if(S.page==='today'){renderToday(true)}else renderCal();return}
  const ad=e.target.closest('[data-addd]');if(ad){openTask(null,ad.dataset.addd);return}
  const act=e.target.closest('[data-act]');if(act){const a=act.dataset.act;if(a==='add')openTask(null,S.sel);else if(a==='settings')openSettings();else if(a==='health')openHealth();else if(a==='move')openMove()}});
function renderCalGridOnly(){const keep=$('#c-list').scrollTop;$('#c-grid').innerHTML=monthGrid();$('#c-list').scrollTop=keep}
$('#c-mode').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){S.cm=b.dataset.m;renderCal()}});
$('#s-per').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){S.per=b.dataset.p;renderStats()}});
const calStep=n=>{{const d=pd(S.cc);d.setMonth(d.getMonth()+n);S.cc=ymd(d);const sd=pd(S.sel);const nd=new Date(d.getFullYear(),d.getMonth(),Math.min(sd.getDate(),new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));S.sel=ymd(nd)}renderCal()};
$('#c-prev').addEventListener('click',()=>calStep(-1));$('#c-next').addEventListener('click',()=>calStep(1));
$('#c-today').addEventListener('click',()=>{S.sel=today();S.cc=S.sel.slice(0,8)+'01';renderCal()});
function swipe(el,fn){let x0=0,y0=0;el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)fn(dx<0?1:-1)},{passive:true})}
swipe($('#week'),d=>{S.sel=addD(S.sel,7*d);S.cc=S.sel.slice(0,8)+'01';renderToday(true)});
swipe($('#c-grid'),calStep);
swipe($('#c-list'),d=>{if(S.cm==='week')calStep(d)});
/* ========== reminders (in-app, honest) ========== */
async function notify(title,body){toast(title+(body?' · '+body:''));try{if('Notification' in window&&Notification.permission==='granted'){const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:title+body});else new Notification(title,{body})}}catch(e){}if(navigator.vibrate)navigator.vibrate(30)}
function tick(){
  const now=new Date(),t0=ymd(now),nowMs=now.getTime();let ch=false;
  [t0,addD(t0,1)].forEach(ds=>tasksOn(ds).forEach(t=>{
    if(!t.time||t.remind==null||isDone(t,ds))return;
    const st=pd(ds);st.setHours(0,tmin(t.time),0,0);const fire=st.getTime()-t.remind*60000,key='r'+t.id+ds;
    if(nowMs>=fire&&nowMs<st.getTime()+Math.max(t.dur||0,15)*60000&&!db.fired[key]){db.fired[key]=nowMs;ch=true;notify(t.title,t.remind?`через ${fmtMin(t.remind)} · ${t.time}`:`сейчас · ${t.time}`)}}));
  const s=db.settings,mk='m'+t0;
  const nm=now.getHours()*60+now.getMinutes(),mm=tmin(s.morningTime||'08:00');
  if(s.morning&&!db.fired[mk]&&nm>=mm&&nm<mm+180){
    db.fired[mk]=nowMs;ch=true;const l=tasksOn(t0);
    if(l.length){const f=l.find(t=>t.time);notify('План на сегодня',pl(l.length,['задача','задачи','задач'])+(f?` · первая в ${f.time}: ${f.title}`:''))}else notify('План на сегодня','задач нет — свободный день')}
  for(const k in db.fired)if(nowMs-db.fired[k]>3*864e5){delete db.fired[k];ch=true}
  if(ch)persist()}
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){orbs.stop();return}
  const t=today();if(t!==S.lastToday){if(S.sel===S.lastToday){S.sel=t;S.cc=t.slice(0,8)+'01'}S.lastToday=t}
  if(S.page==='today')orbs.start();refresh(true);tick()});
/* ========== boot ========== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
go('today');tick();
if(bootNote)toast(bootNote);
restoreFromIDB();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
window.addEventListener('pagehide',()=>{try{const s=JSON.stringify(db);store.set(KEY,s);IDB.put(KEY,s)}catch(e){}});
</script>
